name: Release Dry Run

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  dry-run:
    name: Sign artifacts without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Decode signing key
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          DECODED="$(echo "$MAVEN_SIGNING_KEY" | base64 --decode)"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$DECODED"
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<__EOF__"
            echo "$DECODED"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Publish to local Maven repo (signs, does not upload)
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.NEXUS_SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache -Prelease

      # The unqualified task above publishes every Gradle project: the SDK
      # and the three workload identity providers. Each must have signed its
      # own artifacts.
      - name: Verify signatures were produced
        run: |
          shopt -s globstar nullglob
          missing=0
          for artifact in workos workos-workload-identity-github-actions workos-workload-identity-gcp workos-workload-identity-aws; do
            asc_files=( ~/.m2/repository/com/workos/"$artifact"/**/*.asc )
            if [ ${#asc_files[@]} -eq 0 ]; then
              echo "No .asc signature files found for com.workos:$artifact — signing did not run for it."
              missing=1
              continue
            fi
            echo "Found ${#asc_files[@]} signature file(s) for com.workos:$artifact:"
            printf '  %s\n' "${asc_files[@]}"
          done
          exit "$missing"
